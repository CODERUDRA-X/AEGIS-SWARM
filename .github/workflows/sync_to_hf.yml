name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git Identity
        run: |
          git config --global user.name "CODERUDRA-X"
          git config --global user.email "bot@coderudra.xyz"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir hf_deploy
          # Yahan se README.md hata diya hai
          cp -r server.py requirements.txt Dockerfile mcp_server.py agents/ hf_deploy/
          
          cd hf_deploy
          # HF ke liye zaroori config file yahi bana lenge
          cat << 'EOF' > README.md
          ---
          title: Aegis Swarm Backend
          emoji: 📊
          colorFrom: indigo
          colorTo: yellow
          sdk: docker
          pinned: false
          license: mit
          ---
          EOF
          
          git init
          git checkout -b main
          git add .
          git commit -m "Deploy clean backend with HF config"
          git remote add hf https://oauth2:${HF_TOKEN}@huggingface.co/spaces/CODERUDRA-X/aegis-swarm-backend
          git push --force hf main

