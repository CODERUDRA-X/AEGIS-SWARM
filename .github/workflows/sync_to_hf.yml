name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git Identity
        run: |
          git config --global user.name "CODERUDRA-X"
          git config --global user.email "bot@coderudra.xyz"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git checkout --orphan temp-branch
          git rm -rf --cached . || true
          git add server.py requirements.txt Dockerfile agents/ mcp_server.py README.md .gitattributes
          git commit -m "Sync clean backend files"
          git remote add hf https://oauth2:${HF_TOKEN}@huggingface.co/spaces/CODERUDRA-X/aegis-swarm-backend
          git push --force hf temp-branch:main


